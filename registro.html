<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crea tu cuenta - Matrix</title>
  <link rel="stylesheet" href="developer.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">Matrix</div>
    <a href="index.html" class="btn-inicio"><i class="fa-solid fa-house"></i> Volver a inicio</a>
  </header>

  <main class="login-container">
    <h2>Crea tu cuenta</h2>
    <p class="subtitle">Ingresa tus datos para registrarte en Matrix</p>

    <form class="login-form">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" placeholder="Escribe tu nombre completo">

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" placeholder="ejemplo@correo.com">

      <label for="celular">Número celular</label>
      <input type="tel" id="celular" placeholder="10 dígitos">

      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Crea una contraseña segura">

      <button type="submit" class="btn-submit" disabled>Registrarme</button>
    </form>

    <p class="register-text">¿Ya tienes una cuenta? <a href="index.html">Inicia sesión</a></p>

    <div class="divider"><span>o regístrate con</span></div>

    <div class="social-login">
      <button class="btn-social"><i class="fa-brands fa-google"></i> Registrarme con Google</button>
      <button class="btn-social"><i class="fa-brands fa-microsoft"></i> Registrarme con Microsoft</button>
      <button class="btn-social"><i class="fa-brands fa-apple"></i> Registrarme con Apple</button>
    </div>
  </main>

</body>
</html>
